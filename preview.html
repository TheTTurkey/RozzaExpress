<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Preview - Rosmini Tuckshop" />
    <title>Preview - Rosmini Tuckshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- React and Babel CDNs for browser-only preview -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* ---- Colour Palette ---- */
      :root {
        --clr-bg:        #0a0e1a;
        --clr-surface:   #111827;
        --clr-card:      rgba(255, 255, 255, 0.04);
        --clr-card-hover:rgba(255, 255, 255, 0.08);
        --clr-border:    rgba(255, 255, 255, 0.08);
        --clr-border-hover: rgba(255, 255, 255, 0.18);
        --clr-accent:    #f59e0b;
        --clr-accent-2:  #fb923c;
        --clr-accent-glow: rgba(245, 158, 11, 0.25);
        --clr-student:      #6366f1;
        --clr-student-light:#818cf8;
        --clr-student-glow: rgba(99, 102, 241, 0.30);
        --clr-staff:        #10b981;
        --clr-staff-light:  #34d399;
        --clr-staff-glow:   rgba(16, 185, 129, 0.30);
        --clr-text:      #f1f5f9;
        --clr-text-muted:#94a3b8;
        --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        --radius-sm:  8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --radius-xl: 32px;
        --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-med:  0.35s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-family);
        background: var(--clr-bg);
        color: var(--clr-text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      /* ---- Layout ---- */
      .role-page {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        overflow: hidden;
      }

      .role-page__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        max-width: 820px;
        width: 100%;
      }

      /* ---- Blobs ---- */
      .bg-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.4;
        pointer-events: none;
        z-index: 0;
      }

      .bg-blob--1 {
        width: 500px;
        height: 500px;
        background: var(--clr-student);
        top: -10%;
        left: -10%;
        animation: blobFloat1 18s ease-in-out infinite;
      }

      .bg-blob--2 {
        width: 450px;
        height: 450px;
        background: var(--clr-staff);
        bottom: -10%;
        right: -10%;
        animation: blobFloat2 22s ease-in-out infinite;
      }

      .bg-blob--3 {
        width: 350px;
        height: 350px;
        background: var(--clr-accent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: blobFloat3 15s ease-in-out infinite;
      }

      @keyframes blobFloat1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(60px, 40px) scale(1.1); }
        66%      { transform: translate(-30px, 80px) scale(0.95); }
      }

      @keyframes blobFloat2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(-50px, -30px) scale(1.08); }
        66%      { transform: translate(40px, -60px) scale(0.92); }
      }

      @keyframes blobFloat3 {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.25; }
        50%      { transform: translate(-45%, -55%) scale(1.15); opacity: 0.35; }
      }

      /* ---- Header ---- */
      .role-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        animation: fadeUp 0.7s var(--transition-med) both;
      }

      .role-header__badge {
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(251, 146, 60, 0.08));
        border: 1px solid rgba(245, 158, 11, 0.2);
        margin-bottom: 0.5rem;
        animation: badgePulse 3s ease-in-out infinite;
      }

      .role-header__emoji {
        font-size: 2rem;
      }

      .role-header__title {
        font-size: clamp(2.2rem, 5vw, 3.2rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .role-header__highlight {
        background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .role-header__subtitle {
        font-size: 1.1rem;
        color: var(--clr-text-muted);
        font-weight: 400;
        max-width: 380px;
      }

      @keyframes badgePulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--clr-accent-glow); }
        50%      { box-shadow: 0 0 30px 8px var(--clr-accent-glow); }
      }

      /* ---- Cards Container ---- */
      .role-cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        width: 100%;
        animation: fadeUp 0.7s 0.15s var(--transition-med) both;
      }

      @media (max-width: 600px) {
        .role-cards {
          grid-template-columns: 1fr;
        }
      }

      /* ---- Card ---- */
      .role-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1rem;
        padding: 2.5rem 2rem 2rem;
        border-radius: var(--radius-lg);
        background: var(--clr-card);
        border: 1px solid var(--clr-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition:
          transform var(--transition-med),
          border-color var(--transition-med),
          box-shadow var(--transition-med),
          background var(--transition-med);
        overflow: hidden;
      }

      .role-card:hover {
        transform: translateY(-6px);
        background: var(--clr-card-hover);
      }

      .role-card:active {
        transform: translateY(-2px) scale(0.98);
      }

      .role-card__glow {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        opacity: 0;
        transition: opacity var(--transition-med);
        pointer-events: none;
      }

      /* Student details */
      .role-card--student:hover {
        border-color: rgba(99, 102, 241, 0.35);
        box-shadow:
          0 8px 32px rgba(99, 102, 241, 0.12),
          0 0 0 1px rgba(99, 102, 241, 0.08);
      }

      .role-card--student .role-card__glow {
        background: radial-gradient(circle at 50% 0%, var(--clr-student-glow), transparent 70%);
      }

      .role-card--student:hover .role-card__glow {
        opacity: 1;
      }

      .role-card--student .role-card__icon-wrap {
        color: var(--clr-student-light);
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(129, 140, 248, 0.06));
        border: 1px solid rgba(99, 102, 241, 0.18);
      }

      .role-card--student .role-card__cta {
        background: linear-gradient(135deg, var(--clr-student), var(--clr-student-light));
      }

      /* Staff details */
      .role-card--staff:hover {
        border-color: rgba(16, 185, 129, 0.35);
        box-shadow:
          0 8px 32px rgba(16, 185, 129, 0.12),
          0 0 0 1px rgba(16, 185, 129, 0.08);
      }

      .role-card--staff .role-card__glow {
        background: radial-gradient(circle at 50% 0%, var(--clr-staff-glow), transparent 70%);
      }

      .role-card--staff:hover .role-card__glow {
        opacity: 1;
      }

      .role-card--staff .role-card__icon-wrap {
        color: var(--clr-staff-light);
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(52, 211, 153, 0.06));
        border: 1px solid rgba(16, 185, 129, 0.18);
      }

      .role-card--staff .role-card__cta {
        background: linear-gradient(135deg, var(--clr-staff), var(--clr-staff-light));
      }

      .role-card__icon-wrap {
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-md);
        transition: transform var(--transition-med), box-shadow var(--transition-med);
      }

      .role-card:hover .role-card__icon-wrap {
        transform: scale(1.08);
      }

      .role-icon {
        width: 36px;
        height: 36px;
      }

      .role-card__title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .role-card__desc {
        font-size: 0.9rem;
        color: var(--clr-text-muted);
        line-height: 1.5;
        max-width: 260px;
      }

      .role-card__cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.5rem;
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        margin-top: 0.5rem;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity var(--transition-med),
          transform var(--transition-med),
          box-shadow var(--transition-med);
      }

      .role-card:hover .role-card__cta {
        opacity: 1;
        transform: translateY(0);
      }

      .role-card__cta svg {
        transition: transform var(--transition-fast);
      }

      .role-card:hover .role-card__cta svg {
        transform: translateX(3px);
      }

      .role-footer {
        color: var(--clr-text-muted);
        font-size: 0.8rem;
        opacity: 0.6;
        animation: fadeUp 0.7s 0.3s var(--transition-med) both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const roles = [
        {
          id: 'student',
          title: 'Student',
          description: 'Order your lunch and snacks for pickup at the tuckshop',
          icon: (
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className="role-icon">
              <rect x="14" y="8" width="36" height="48" rx="4" stroke="currentColor" strokeWidth="2.5" />
              <rect x="20" y="16" width="24" height="6" rx="2" fill="currentColor" opacity="0.25" />
              <line x1="20" y1="30" x2="44" y2="30" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              <line x1="20" y1="37" x2="38" y2="37" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              <line x1="20" y1="44" x2="32" y2="44" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              <circle cx="48" cy="48" r="12" fill="currentColor" opacity="0.15" />
              <path d="M44 48l3 3 6-6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          ),
        },
        {
          id: 'staff',
          title: 'Staff',
          description: 'Manage orders, update the menu, and view daily reports',
          icon: (
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className="role-icon">
              <circle cx="32" cy="20" r="10" stroke="currentColor" strokeWidth="2.5" />
              <path d="M12 54c0-11.046 8.954-20 20-20s20 8.954 20 20" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
              <rect x="38" y="38" width="18" height="18" rx="4" fill="currentColor" opacity="0.15" />
              <path d="M44 47h6M47 44v6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
            </svg>
          ),
        },
      ];

      function RoleSelect() {
        const [hoveredRole, setHoveredRole] = useState(null);

        const handleSelect = (roleId) => {
          alert(`Success! Selected role: ${roleId.toUpperCase()}`);
        };

        return (
          <div className="role-page">
            <div className="bg-blob bg-blob--1" />
            <div className="bg-blob bg-blob--2" />
            <div className="bg-blob bg-blob--3" />

            <div className="role-page__content">
              <header className="role-header">
                <div className="role-header__badge">
                  <span className="role-header__emoji">🍕</span>
                </div>
                <h1 className="role-header__title">
                  Rosmini <span className="role-header__highlight">Tuckshop</span>
                </h1>
                <p className="role-header__subtitle">
                  Welcome! Choose how you'd like to sign in.
                </p>
              </header>

              <div className="role-cards">
                {roles.map((role) => (
                  <button
                    key={role.id}
                    className={`role-card role-card--${role.id}`}
                    onMouseEnter={() => setHoveredRole(role.id)}
                    onMouseLeave={() => setHoveredRole(null)}
                    onClick={() => handleSelect(role.id)}
                  >
                    <div className="role-card__glow" />
                    <div className="role-card__icon-wrap">{role.icon}</div>
                    <h2 className="role-card__title">{role.title}</h2>
                    <p className="role-card__desc">{role.description}</p>
                    <div className="role-card__cta">
                      Continue
                      <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.5"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                      >
                        <path d="M5 12h14M12 5l7 7-7 7" />
                      </svg>
                    </div>
                  </button>
                ))}
              </div>

              <footer className="role-footer">
                <p>Rosmini College &copy; {new Date().getFullYear()}</p>
              </footer>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<RoleSelect />);
    </script>
  </body>
</html>
